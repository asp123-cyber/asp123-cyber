<svg xmlns="http://www.w3.org/2000/svg" width="840" height="264" viewBox="0 0 840 264" role="img" aria-labelledby="title desc"><title id="title">Quantum gates: H, H, X</title><desc id="desc">Educational illustration. Zero becomes plus, then zero, then one. Probability bars show computational-basis measurement at the indicated stage.</desc><style>.frame{opacity:0}.f3{opacity:1}@keyframes f0{0%{opacity:1}25%,100%{opacity:0}}.f0{animation:f0 10s steps(1,end) 1 both}@keyframes f1{0%{opacity:0}25%{opacity:1}50%,100%{opacity:0}}.f1{animation:f1 10s steps(1,end) 1 both}@keyframes f2{0%{opacity:0}50%{opacity:1}75%,100%{opacity:0}}.f2{animation:f2 10s steps(1,end) 1 both}@keyframes f3{0%{opacity:0}75%,100%{opacity:1}}.f3{animation:f3 10s steps(1,end) 1 both}@media(prefers-reduced-motion:reduce){.frame{animation:none!important;opacity:0!important}.f3{opacity:1!important}}</style><rect x="1" y="1" width="838" height="262" rx="16" fill="#101a2a" stroke="#31425a" /><text x="30" y="34" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start" fill="#71d8d2">01 / QUANTUM FUNDAMENTALS</text><text x="30" y="65" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#edf3fa">Gates change a state.</text><g class="frame f0"><line x1="72" y1="127" x2="407" y2="127" stroke="#31425a" stroke-width="2" /><text x="34" y="134" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="23" font-weight="400" text-anchor="start" fill="#edf3fa">|0⟩</text><rect x="104" y="104" width="44" height="46" rx="7" fill="#162337" stroke="#a7b8cc" /><text x="126" y="135" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#a7b8cc">H</text><text x="126" y="176" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="400" text-anchor="middle" fill="#a7b8cc">1</text><rect x="203" y="104" width="44" height="46" rx="7" fill="#162337" stroke="#a7b8cc" /