<svg xmlns="http://www.w3.org/2000/svg" width="840" height="264" viewBox="0 0 840 264" role="img" aria-labelledby="title desc"><title id="title">Quantum gates: H, H, X</title><desc id="desc">Educational illustration. Zero becomes plus, then zero, then one. Probability bars show computational-basis measurement at the indicated stage.</desc><rect x="1" y="1" width="838" height="262" rx="16" fill="#f8fafc" stroke="#d9e2ec" /><text x="30" y="34" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start" fill="#087f86">01 / QUANTUM FUNDAMENTALS</text><text x="30" y="65" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#182b40">Gates change a state.</text><line x1="72" y1="127" x2="407" y2="127" stroke="#d9e2ec" stroke-width="2" /><text x="34" y="134" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="23" font-weight="400" text-anchor="start" fill="#182b40">|0⟩</text><rect x="104" y="104" width="44" height="46" rx="7" fill="#ffffff" stroke="#087f86" /><text x="126" y="135" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#087f86">H</text><text x="126" y="176" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="400" text-anchor="middle" fill="#536579">1</text><rect x="203" y="104" width="44" height="46" rx="7" fill="#ffffff" stroke="#087f86" /><text x="225" y="135" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#087f86">H</text><text x="225" y="176" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="400" text-anchor="middle" fill="#536579">2</text><rect x="302" y="104" width="44" height="46" rx="7" fill="#ffffff" stroke="#7152ad" /><text x="324" y="135" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#7152ad">X</text><text x="324" y="176" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="400" text-anchor="middle" fill="#536579">3</text><line x1="445" y1="83" x2="445" y2="204" stroke="#d9e2ec" stroke-width="1.5" /><text x="473" y="106" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="12" font-weight="700" text-anchor="start" fill="#536579">STATE</text><text x="470" y="151" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="32" font-weight="400" text-anchor="start" fill="#087f86">|1⟩</text><text x="473" y="184" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#536579">Step 3 / 3</text><text x="691" y="87" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#536579">MEASUREMENT</text><rect x="616" y="116" width="46" height="65" rx="3" fill="#eaf2f5" stroke="none" /><text x="639.0" y="108" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#182b40">0%</text><text x="639.0" y="204" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="15" font-weight="400" text-anchor="middle" fill="#536579">P(0)</text><rect x="720" y="116" width="46" height="65" rx="3" fill="#eaf2f5" stroke="none" /><rect x="720" y="116.00000000000003" width="46" height="64.99999999999997" rx="3" fill="#7152ad" stroke="none" /><text x="743.0" y="108" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#182b40">100%</text><text x="743.0" y="204" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="15" font-weight="400" text-anchor="middle" fill="#536579">P(1)</text><text x="34" y="202" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#182b40">X swaps zero to one</text><text x="30" y="244" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#536579">Ideal circuit · no intermediate measurement</tex