<svg xmlns="http://www.w3.org/2000/svg" width="400" height="426" viewBox="0 0 400 426" role="img" aria-labelledby="title desc"><title id="title">Quantum gates: H, H, X</title><desc id="desc">Educational illustration. Zero becomes plus, then zero, then one. Probability bars show computational-basis measurement at the indicated stage.</desc><rect x="1" y="1" width="398" height="424" rx="16" fill="#101a2a" stroke="#31425a" /><text x="30" y="34" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start" fill="#71d8d2">01 / QUANTUM FUNDAMENTALS</text><text x="30" y="65" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#edf3fa">Gates change a state.</text><line x1="72" y1="124" x2="366" y2="124" stroke="#31425a" stroke-width="2" /><text x="34" y="131" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="23" font-weight="400" text-anchor="start" fill="#edf3fa">|0⟩</text><rect x="96" y="101" width="44" height="46" rx="7" fill="#162337" stroke="#71d8d2" /><text x="118" y="132" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#71d8d2">H</text><text x="118" y="173" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="400" text-anchor="middle" fill="#a7b8cc">1</text><rect x="194" y="101" width="44" height="46" rx="7" fill="#162337" stroke="#71d8d2" /><text x="216" y="132" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#71d8d2">H</text><text x="216" y="173" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="400" text-anchor="middle" fill="#a7b8cc">2</text><rect x="292" y="101" width="44" height="46" rx="7" fill="#162337" stroke="#c3a9f0" /><text x="314" y="132" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#c3a9f0">X</text><text x="314" y="173" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="400" text-anchor="middle" fill="#a7b8cc">3</text><line x1="30" y1="195" x2="370" y2="195" stroke="#31425a" stroke-width="1.5" /><text x="34" y="225" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="start" fill="#a7b8cc">STATE</text><text x="32" y="271" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="35" font-weight="400" text-anchor="start" fill="#71d8d2">|1⟩</text><text x="34" y="308" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#a7b8cc">Step 3 / 3</text><text x="277" y="225" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#a7b8cc">MEASUREMENT</text><rect x="214" y="254" width="42" height="86" rx="3" fill="#203249" stroke="none" /><text x="235.0" y="246" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#edf3fa">0%</text><text x="235.0" y="363" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="15" font-weight="400" text-anchor="middle" fill="#a7b8cc">P(0)</text><rect x="298" y="254" width="42" height="86" rx="3" fill="#203249" stroke="none" /><rect x="298" y="254.00000000000006" width="42" height="85.99999999999996" rx="3" fill="#c3a9f0" stroke="none" /><text x="319.0" y="246" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#edf3fa">100%</text><text x="319.0" y="363" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="15" font-weight="400" text-anchor="middle" fill="#a7b8cc">P(1)</text><text x="34" y="376" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#edf3fa">X swaps zero to one</text><text x="30" y="406" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#a7b8cc">Ideal circuit · no intermediate measurement</text></svg>
